<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Same mark as src/components/logo.tsx, on a filled badge. A bare glyph
    disappears against a browser tab; the solid ground is what keeps it legible
    at 16px. The badge colour is fixed rather than theme-aware: a favicon is
    identity, and a mark that changed colour with the page would read as a
    different site.
  -->
  <rect width="24" height="24" rx="6" fill="#6674e8"/>
  <g transform="translate(2.4 2.4) scale(0.8)" fill="none" stroke="#fff">
    <path d="M3 6.5h8.5M3 12h6.5M3 17.5h4.5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M17.6 5.6v6.2" stroke-width="3" stroke-linecap="round"/>
    <path d="M13.3 10.5h8.6L17.6 18z" fill="#fff" stroke="none"/>
  </g>
</svg>
